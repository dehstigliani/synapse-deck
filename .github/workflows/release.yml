name: release

# Publica os binários dos três sistemas quando uma tag `v*` é empurrada.
# `workflow_dispatch` permite ensaiar a matriz sem criar tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Um sistema quebrado não deve esconder o resultado dos outros.
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows-x86_64
            target: x86_64-pc-windows-msvc
            binary: synapse-deck.exe
          - os: ubuntu-latest
            label: linux-x86_64
            target: x86_64-unknown-linux-gnu
            binary: synapse-deck
          - os: macos-latest
            label: macos-arm64
            target: aarch64-apple-darwin
            binary: synapse-deck

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # Teste antes de empacotar: release que não passa no teste não sai.
      - name: testes
        run: cargo test --locked --target ${{ matrix.target }}

      - name: build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: empacota (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "synapse-deck-${{ matrix.label }}"
          # A pasta de montagem tem nome próprio: se ela se chamasse como o
          # asset, o binário solto cairia dentro dela em vez de virar arquivo.
          New-Item -ItemType Directory dist/$name -Force | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.binary }}" dist/$name
          Copy-Item README.md, CHANGELOG.md, LICENSE dist/$name
          Compress-Archive -Path dist/$name -DestinationPath "$name.zip"
          # O binário solto é o que o atualizador embutido baixa: sem ele,
          # atualizar exigiria uma dependência de descompactação.
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.binary }}" "$name.exe"

      - name: empacota (unix)
        if: runner.os != 'Windows'
        run: |
          name="synapse-deck-${{ matrix.label }}"
          # A pasta de montagem fica sob dist/ pelo mesmo motivo do Windows.
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "dist/$name/"
          cp README.md CHANGELOG.md LICENSE "dist/$name/"
          tar -czf "$name.tar.gz" -C dist "$name"
          # O binário solto é o que o atualizador embutido baixa.
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "$name"

      # Instalador de verdade para Windows: menu Iniciar, desinstalador e
      # entrada em Programas e Recursos. Inno em vez de MSI porque o MSI exige
      # versão numérica de três partes e recusaria "1.0.0-alpha.2".
      - name: instalador (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          $binary = (Resolve-Path "target/${{ matrix.target }}/release/${{ matrix.binary }}").Path
          # ${env:ProgramFiles(x86)} com chaves: sem elas o PowerShell trata os
          # parênteses como chamada e a variável não expande.
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { throw "ISCC.exe nao encontrado em $iscc" }
          & $iscc /DAppVersion=$version /DBinary=$binary `
            /O"$PWD" /F"synapse-deck-setup-$version" `
            packaging/windows/synapse-deck.iss
          Get-ChildItem synapse-deck-setup-*.exe | ForEach-Object {
            "gerado: $($_.Name) ($([math]::Round($_.Length/1MB,2)) MB)"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: synapse-deck-${{ matrix.label }}
          path: |
            synapse-deck-${{ matrix.label }}.zip
            synapse-deck-${{ matrix.label }}.tar.gz
            synapse-deck-${{ matrix.label }}.exe
            synapse-deck-${{ matrix.label }}
            synapse-deck-setup-*.exe
          if-no-files-found: error

  publish:
    name: publica o release
    needs: build
    runs-on: ubuntu-latest
    # Só publica em tag; o disparo manual serve apenas para validar a matriz.
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: cria o release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          # Qualquer coisa com hífen na versão (alpha, beta, rc) entra como pré-lançamento.
          prerelease=""
          case "$version" in *-*) prerelease="--prerelease" ;; esac
          # O release traz dois .exe no Windows: o instalador e o binario solto
          # que o atualizador embutido baixa. Sem esta nota e facil baixar o
          # errado, entao ela vai no topo, antes do changelog.
          {
            echo "## Instalar"
            echo
            echo "| Sistema | Baixe |"
            echo "|---|---|"
            echo "| **Windows** | \`synapse-deck-setup-$version.exe\` — o instalador |"
            echo "| **macOS (Apple Silicon)** | \`synapse-deck-macos-arm64.tar.gz\` |"
            echo "| **Linux (x86_64)** | \`synapse-deck-linux-x86_64.tar.gz\` |"
            echo
            echo "Os arquivos \`synapse-deck-<sistema>\` soltos **nao sao para baixar a mao**:"
            echo "sao o que o atualizador dentro do programa consome."
            echo
            echo "> Os binarios nao sao assinados. O SmartScreen do Windows avisa na primeira"
            echo "> execucao (Mais informacoes / Executar assim mesmo), e o macOS nao esta notarizado."
            echo
            echo "---"
            echo
            cat CHANGELOG.md
          } > notas-do-release.md

          gh release create "$GITHUB_REF_NAME" \
            --title "Synapse Deck $version" \
            --notes-file notas-do-release.md \
            $prerelease \
            artifacts/*
