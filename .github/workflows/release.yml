name: release

# Publica os binários dos três sistemas quando uma tag `v*` é empurrada.
# `workflow_dispatch` permite ensaiar a matriz sem criar tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Um sistema quebrado não deve esconder o resultado dos outros.
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows-x86_64
            target: x86_64-pc-windows-msvc
            binary: synapse-deck.exe
          - os: ubuntu-latest
            label: linux-x86_64
            target: x86_64-unknown-linux-gnu
            binary: synapse-deck
          - os: macos-latest
            label: macos-arm64
            target: aarch64-apple-darwin
            binary: synapse-deck

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # Teste antes de empacotar: release que não passa no teste não sai.
      - name: testes
        run: cargo test --locked --target ${{ matrix.target }}

      - name: build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: empacota (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dir = "synapse-deck-${{ matrix.label }}"
          New-Item -ItemType Directory $dir | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.binary }}" $dir
          Copy-Item README.md, CHANGELOG.md, LICENSE $dir
          Compress-Archive -Path $dir -DestinationPath "$dir.zip"

      - name: empacota (unix)
        if: runner.os != 'Windows'
        run: |
          dir="synapse-deck-${{ matrix.label }}"
          mkdir "$dir"
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "$dir/"
          cp README.md CHANGELOG.md LICENSE "$dir/"
          tar -czf "$dir.tar.gz" "$dir"

      - uses: actions/upload-artifact@v4
        with:
          name: synapse-deck-${{ matrix.label }}
          path: |
            synapse-deck-*.zip
            synapse-deck-*.tar.gz
          if-no-files-found: error

  publish:
    name: publica o release
    needs: build
    runs-on: ubuntu-latest
    # Só publica em tag; o disparo manual serve apenas para validar a matriz.
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: cria o release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          # Qualquer coisa com hífen na versão (alpha, beta, rc) entra como pré-lançamento.
          prerelease=""
          case "$version" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" \
            --title "Synapse Deck $version" \
            --notes-file CHANGELOG.md \
            $prerelease \
            artifacts/*
