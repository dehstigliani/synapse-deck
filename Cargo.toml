[package]
name = "synapse-deck"
version = "1.0.0-alpha.3"
edition = "2021"
description = "Synapse Deck — o deck de terminais e agentes, com PTY em Rust"
license = "MIT"
repository = "https://github.com/dehstigliani/synapse-deck"

[dependencies]
mime_guess = "2"
rust-embed = "8"
anyhow = "1"
axum = { version = "0.7", features = ["ws"] }
futures-util = "0.3"
portable-pty = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Cliente HTTP pequeno, só para consultar e baixar o release.
ureq = { version = "2", features = ["json"] }
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }

[profile.release]
# Binario de release: menor e mais rapido, ao custo de compilar mais devagar.
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
