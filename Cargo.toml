[package]
name = "rust-pty-terminal-workspace"
version = "0.1.0"
edition = "2021"
description = "Workspace de terminais nomeados com PTY, integrado ao Claude Code"

[dependencies]
anyhow = "1"
axum = { version = "0.7", features = ["ws"] }
futures-util = "0.3"
portable-pty = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["fs"] }
uuid = { version = "1", features = ["v4"] }
