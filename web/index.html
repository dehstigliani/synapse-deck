<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Synapse Deck</title>
<link rel="stylesheet" href="/vendor/xterm.css" />
<style>
  /* As cores vivem em variáveis para o tema poder trocar tudo de uma vez. */
  :root {
    --bg: #0c0e13;
    --sidebar: #161a25;
    --panel: #161a25;
    --border: #252a3b;
    --text: #ebecf4;
    --muted: #8a90ad;
    --accent: #f37035;
    --accent-soft: #252a3b;
    --alive: #01d5bf;
    --dead: #a3a3a3;
    --warn: #f0b100;
    --danger: #ff6baa;
  }
  * { box-sizing: border-box; }
  body {
    color-scheme: dark light;
    margin: 0;
    height: 100vh;
    display: grid;
    grid-template-columns: 256px 1fr;
    background: var(--bg);
    color: var(--text);
    font: 13px/1.5 ui-monospace, "Cascadia Mono", "JetBrains Mono", Consolas, monospace;
  }
  body.with-panel { grid-template-columns: 256px 1fr 340px; }
  button { font: inherit; cursor: pointer; }

  /* ---------- sidebar ---------- */
  aside {
    background: var(--sidebar);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  .brand {
    padding: 13px 14px 10px;
    font-size: 11px;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--muted);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .brand select {
    margin-left: auto;
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 2px 4px;
    font: inherit;
    font-size: 11px;
  }
  .list { flex: 1; overflow-y: auto; padding: 6px 8px 16px; }

  .group-head {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 9px 6px 4px;
    font-size: 10px;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--muted);
    cursor: pointer;
    user-select: none;
  }
  .group-head .caret { transition: transform .12s; font-size: 9px; }
  .group-head.collapsed .caret { transform: rotate(-90deg); }
  .group-head .count { margin-left: auto; opacity: .7; }

  .item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 9px;
    border-radius: 6px;
    cursor: pointer;
  }
  .item:hover { background: var(--accent-soft); }
  .item.active { background: var(--accent-soft); box-shadow: inset 2px 0 0 var(--accent); }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--alive); flex: none; }
  .dot.dead { background: var(--dead); }
  .item .label { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .tool {
    opacity: 0;
    border: 0;
    background: none;
    color: var(--muted);
    font-size: 13px;
    padding: 0 2px;
  }
  .item:hover .tool { opacity: 1; }
  .item .tool:hover { color: var(--text); }
  .item .tool.kill:hover { color: var(--danger); }
  .item input {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--accent);
    border-radius: 4px;
    color: var(--text);
    font: inherit;
    padding: 2px 5px;
  }
  .empty { color: var(--muted); padding: 12px 8px; font-size: 12px; }

  .actions { padding: 9px; border-top: 1px solid var(--border); display: flex; gap: 6px; flex-wrap: wrap; }
  .actions button {
    flex: 1;
    min-width: 84px;
    padding: 7px 6px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--bg);
    color: var(--text);
  }
  .actions button:hover { border-color: var(--accent); }

  /* ---------- painel do terminal ---------- */
  main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .topbar {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 8px 14px;
    border-bottom: 1px solid var(--border);
    color: var(--muted);
    font-size: 12px;
    min-height: 40px;
  }
  .topbar > * { white-space: nowrap; flex: none; }
  .topbar .name { color: var(--text); font-weight: 600; }
  .topbar .cwd { overflow: hidden; text-overflow: ellipsis; max-width: 34ch; }
  .topbar .spacer { margin-left: auto; flex: 1; }
  .topbar code {
    max-width: 30ch;
    overflow: hidden;
    text-overflow: ellipsis;
    background: var(--sidebar);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 2px 6px;
    color: var(--accent);
    cursor: pointer;
  }
  .topbar button.ghost {
    background: none;
    border: 1px solid var(--border);
    border-radius: 5px;
    color: var(--muted);
    padding: 3px 8px;
  }
  .topbar button.ghost:hover { color: var(--text); border-color: var(--accent); }

  /* pulso de consumo na navbar */
  .pulse { display: flex; align-items: center; gap: 7px; }
  .pulse .label { color: var(--muted); }
  .pulse .value { color: var(--text); }
  .pulse .sep { color: var(--border); }
  .pulse .bar { display: block; width: 54px; height: 6px; background: var(--accent-soft); border-radius: 3px; overflow: hidden; }
  .pulse .fill { display: block; height: 100%; width: 0; background: var(--accent); transition: width .3s; }

  /* medidor de contexto */
  .meter { display: flex; align-items: center; gap: 7px; }
  .meter .bar {
    width: 84px; height: 6px;
    background: var(--accent-soft);
    border-radius: 3px;
    overflow: hidden;
  }
  .meter .fill { display: block; height: 100%; width: 0; background: var(--alive); transition: width .3s; }
  .meter .fill.mid { background: var(--warn); }
  .meter .fill.high { background: var(--danger); }
  .meter .value { color: var(--text); }

  .screens { flex: 1; position: relative; min-height: 0; }
  .screen { position: absolute; inset: 0; padding: 6px 0 0 8px; display: none; }
  .screen.active { display: block; }
  .placeholder {
    position: absolute; inset: 0;
    display: grid; place-content: center;
    color: var(--muted); text-align: center; line-height: 2;
  }

  /* ---------- painel de sessões ---------- */
  .panel {
    background: var(--panel);
    border-left: 1px solid var(--border);
    display: none;
    flex-direction: column;
    min-height: 0;
  }
  body.with-panel .panel { display: flex; }
  .panel h2 {
    margin: 0;
    padding: 13px 14px 10px;
    font-size: 11px;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 400;
    border-bottom: 1px solid var(--border);
  }
  .sessions { flex: 1; overflow-y: auto; padding: 8px; }
  .session {
    border: 1px solid var(--border);
    border-radius: 7px;
    padding: 9px 10px;
    margin-bottom: 7px;
    cursor: pointer;
  }
  .session:hover { border-color: var(--accent); }
  .session .title { color: var(--text); margin-bottom: 4px; word-break: break-word; }
  .session .meta { color: var(--muted); font-size: 11px; display: flex; gap: 8px; flex-wrap: wrap; }
  .session .meta .tokens { color: var(--accent); }

  /* abas do painel */
  .tabs { display: flex; border-bottom: 1px solid var(--border); }
  .tabs button {
    flex: 1;
    padding: 9px 4px;
    background: none;
    border: 0;
    border-bottom: 2px solid transparent;
    color: var(--muted);
    font-size: 11px;
    letter-spacing: .06em;
    text-transform: uppercase;
  }
  .tabs button:hover { color: var(--text); }
  .tabs button.active { color: var(--accent); border-bottom-color: var(--accent); }
  .panel-body { flex: 1; overflow-y: auto; padding: 10px; }

  .boot-head {
    color: var(--accent);
    font-size: 11px;
    padding: 10px 2px 5px;
    border-bottom: 1px dashed var(--border);
    margin-bottom: 6px;
  }
  .adopt {
    margin-left: auto;
    background: none;
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--muted);
    font-size: 10px;
    padding: 1px 6px;
  }
  .adopt:hover { color: var(--accent); border-color: var(--accent); }

  /* cartões de uso */
  .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; margin-bottom: 12px; }
  .stat {
    border: 1px solid var(--border);
    border-radius: 7px;
    padding: 8px 10px;
  }
  .stat .k { color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: .06em; }
  .stat .v { color: var(--text); font-size: 15px; margin-top: 2px; }
  .stat .v.accent { color: var(--accent); }
  .note { color: var(--muted); font-size: 11px; line-height: 1.5; margin: 10px 0; }
  .bars { display: flex; flex-direction: column; gap: 4px; }
  .bars .row { display: flex; align-items: center; gap: 7px; font-size: 11px; }
  .bars .row .who { color: var(--muted); width: 78px; flex: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bars .row .track { display: block; flex: 1; height: 7px; background: var(--accent-soft); border-radius: 3px; overflow: hidden; }
  .bars .row .fill { display: block; height: 100%; background: var(--accent); }
  .bars .row .amount { color: var(--text); width: 52px; text-align: right; flex: none; }
</style>
</head>
<body>
  <aside>
    <div class="brand">
      Synapse Deck
      <select id="theme-select" title="tema"></select>
    </div>
    <div class="list" id="list"><div class="empty">nenhum terminal ainda</div></div>
    <div class="actions">
      <button id="new-claude">+ Claude</button>
      <button id="new-shell">+ Shell</button>
      <button id="new-group">+ Pasta</button>
    </div>
  </aside>

  <main>
    <div class="topbar">
      <span class="name" id="active-name">—</span>
      <span class="cwd" id="active-cwd"></span>
      <span class="spacer"></span>
      <span class="pulse" id="pulse" hidden>
        <span class="label">hora</span>
        <span class="bar"><span class="fill" id="pulse-fill"></span></span>
        <span class="value" id="pulse-hour">—</span>
        <span class="sep">|</span>
        <span class="label">semana</span>
        <span class="value" id="pulse-week">—</span>
      </span>
      <span class="meter" id="meter" hidden>
        <span title="quanto da janela de contexto a sessão já ocupa">contexto</span>
        <span class="bar"><span class="fill" id="meter-fill"></span></span>
        <span class="value" id="meter-value"></span>
      </span>
      <span id="active-session"></span>
      <button class="ghost" id="toggle-panel">sessões</button>
    </div>
    <div class="screens" id="screens">
      <div class="placeholder" id="placeholder">
        Crie um terminal na barra ao lado.<br />
        Os processos vivem no daemon: fechar esta janela não mata a sessão.
      </div>
    </div>
  </main>

  <section class="panel">
    <div class="tabs" id="tabs">
      <button data-tab="sessions" class="active">Sessões</button>
      <button data-tab="boot">Boot</button>
      <button data-tab="active">Ativas</button>
      <button data-tab="usage">Uso</button>
    </div>
    <div class="panel-body" id="panel-body"><div class="empty">selecione um terminal</div></div>
  </section>

<script src="/vendor/xterm.js"></script>
<script src="/vendor/addon-fit.js"></script>
<script>
// ---------------------------------------------------------------- temas
// Cada tema traz as variáveis da interface e a paleta do xterm. Para adicionar
// um tema novo basta mais uma entrada aqui — nada mais no código muda.
const THEMES = {
  dracula: {
    label: 'Dracula',
    ui: {
      '--bg': '#282a36',
      '--sidebar': '#21222c',
      '--panel': '#21222c',
      '--border': '#44475a',
      '--text': '#f8f8f2',
      '--muted': '#6272a4',
      '--accent': '#bd93f9',
      '--accent-soft': '#44475a',
      '--alive': '#50fa7b',
      '--dead': '#6272a4',
      '--warn': '#ffb86c',
      '--danger': '#ff5555',
    },
    // Paleta ANSI oficial do Dracula.
    xterm: {
      background: '#282a36', foreground: '#f8f8f2',
      cursor: '#f8f8f2', cursorAccent: '#282a36', selectionBackground: '#44475a',
      black: '#21222c', red: '#ff5555', green: '#50fa7b', yellow: '#f1fa8c',
      blue: '#bd93f9', magenta: '#ff79c6', cyan: '#8be9fd', white: '#f8f8f2',
      brightBlack: '#6272a4', brightRed: '#ff6e6e', brightGreen: '#69ff94',
      brightYellow: '#ffffa5', brightBlue: '#d6acff', brightMagenta: '#ff92df',
      brightCyan: '#a4ffff', brightWhite: '#ffffff',
    },
  },

  // Orange Innovation — identidade Retina/infra sobre a ossatura do Dracula.
  // Os tokens de marca são os reais do design system: laranja #f37035, ciano de
  // destaque #01d5bf e a pilha de fundos #0c0e13 → #252a3b. O que o Dracula
  // empresta é a calibragem da paleta ANSI, que é boa para terminal; os slots
  // que carregam significado (cursor, ciano, amarelo, azul) vestem a marca.
  'orange-innovation': {
    label: 'Orange Innovation',
    ui: {
      '--bg': '#0c0e13',
      '--sidebar': '#161a25',
      '--panel': '#161a25',
      '--border': '#252a3b',
      '--text': '#ebecf4',
      // Derivado entre icons-secondary (#adb2cf) e background-4 (#3a4058):
      // o token cheio brilha demais como texto secundário sobre #0c0e13.
      '--muted': '#8a90ad',
      '--accent': '#f37035',
      '--accent-soft': '#252a3b',
      '--alive': '#01d5bf',
      '--dead': '#a3a3a3',
      '--warn': '#f0b100',
      '--danger': '#ff6baa',
    },
    xterm: {
      background: '#0c0e13', foreground: '#ebecf4',
      cursor: '#f37035', cursorAccent: '#0c0e13', selectionBackground: '#252a3b',
      black: '#1e222f', red: '#ff6baa', green: '#50fa7b', yellow: '#f0b100',
      blue: '#219cb5', magenta: '#ff79c6', cyan: '#01d5bf', white: '#ebecf4',
      brightBlack: '#3a4058', brightRed: '#ff8fc0', brightGreen: '#69ff94',
      brightYellow: '#ffd700', brightBlue: '#35c0dc', brightMagenta: '#ff92df',
      brightCyan: '#4ff0dd', brightWhite: '#ffffff',
    },
  },

  // Draculight — o claro da casa, construído sobre o Alucard, que é o tema claro
  // oficial do Dracula (o nome é Dracula ao contrário). O fundo creme #fffbeb
  // cansa menos que branco puro, e o laranja da marca entra no lugar do roxo
  // para o par escuro/claro compartilhar a mesma cor de destaque.
  draculight: {
    label: 'Draculight',
    ui: {
      '--bg': '#fffbeb',
      '--sidebar': '#f5f0dc',
      '--panel': '#f5f0dc',
      '--border': '#dcd7c0',
      '--text': '#1f1f1f',
      '--muted': '#6c664b',
      '--accent': '#c25316',
      '--accent-soft': '#e8e2ca',
      '--alive': '#14710a',
      '--dead': '#9a9585',
      '--warn': '#a34d14',
      '--danger': '#cb3a2a',
    },
    xterm: {
      background: '#fffbeb', foreground: '#1f1f1f',
      cursor: '#c25316', cursorAccent: '#fffbeb', selectionBackground: '#cfcfde',
      black: '#1f1f1f', red: '#cb3a2a', green: '#14710a', yellow: '#846e15',
      blue: '#644ac9', magenta: '#a3144d', cyan: '#036a96', white: '#e8e2ca',
      brightBlack: '#6c664b', brightRed: '#e35f4f', brightGreen: '#2a9c1e',
      brightYellow: '#a38a1f', brightBlue: '#7d63e0', brightMagenta: '#c2246a',
      brightCyan: '#0587bd', brightWhite: '#fffbeb',
    },
  },
};

let currentTheme = localStorage.getItem('theme') || 'orange-innovation';

function applyTheme(key) {
  const theme = THEMES[key];
  if (!theme) return;
  currentTheme = key;
  localStorage.setItem('theme', key);
  for (const [variable, value] of Object.entries(theme.ui)) {
    document.documentElement.style.setProperty(variable, value);
  }
  // Terminais já abertos trocam de paleta ao vivo.
  for (const pane of panes.values()) pane.term.options.theme = theme.xterm;
}

// ---------------------------------------------------------------- estado
const panes = new Map();
let activeId = null;
let terminals = [];
/// Enquanto um campo de nome está aberto, a sidebar não se redesenha —
/// senão o poll periódico apaga o que está sendo digitado.
let editing = false;
const collapsedGroups = new Set();

const listEl = document.getElementById('list');
const screensEl = document.getElementById('screens');
const placeholderEl = document.getElementById('placeholder');
const panelBody = document.getElementById('panel-body');
let activeTab = 'sessions';

async function api(path, options) {
  const response = await fetch(`/api${path}`, {
    headers: { 'content-type': 'application/json' },
    ...options,
  });
  if (!response.ok) throw new Error(await response.text());
  return response.status === 204 ? null : response.json();
}

const formatTokens = (value) =>
  value >= 1e6 ? `${(value / 1e6).toFixed(1)}M` : value >= 1e3 ? `${Math.round(value / 1e3)}k` : String(value);

const formatDate = (epochSeconds) =>
  new Date(epochSeconds * 1000).toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' });

// ---------------------------------------------------------------- sidebar
async function refresh() {
  terminals = await api('/terminals');
  if (activeId && !terminals.some((item) => item.id === activeId)) activeId = null;
  renderSidebar();
  if (!activeId && terminals.length) return activate(terminals[0].id);
  updateTopbar();
}

function renderSidebar() {
  if (editing) return;
  listEl.textContent = '';
  if (!terminals.length) {
    const empty = document.createElement('div');
    empty.className = 'empty';
    empty.textContent = 'nenhum terminal ainda';
    listEl.append(empty);
    return;
  }

  // Agrupa preservando a ordem de criação das pastas.
  const groups = new Map();
  for (const item of terminals) {
    if (!groups.has(item.group)) groups.set(item.group, []);
    groups.get(item.group).push(item);
  }

  for (const [group, members] of groups) {
    const head = document.createElement('div');
    const collapsed = collapsedGroups.has(group);
    head.className = 'group-head' + (collapsed ? ' collapsed' : '');
    head.onclick = () => {
      collapsed ? collapsedGroups.delete(group) : collapsedGroups.add(group);
      renderSidebar();
    };
    const caret = document.createElement('span');
    caret.className = 'caret';
    caret.textContent = '▼';
    const title = document.createElement('span');
    title.textContent = group;
    const count = document.createElement('span');
    count.className = 'count';
    count.textContent = members.length;
    head.append(caret, title, count);
    listEl.append(head);

    if (collapsed) continue;
    for (const item of members) listEl.append(renderItem(item));
  }
}

function renderItem(item) {
  const row = document.createElement('div');
  row.className = 'item' + (item.id === activeId ? ' active' : '');
  row.onclick = () => activate(item.id);

  const dot = document.createElement('span');
  dot.className = 'dot' + (item.alive ? '' : ' dead');
  dot.title = item.alive ? 'rodando' : 'processo encerrado';

  const label = document.createElement('span');
  label.className = 'label';
  label.textContent = item.name;
  label.title = `${item.command} — ${item.cwd}`;
  label.ondblclick = (event) => {
    event.stopPropagation();
    startInlineEdit(row, label, item, 'name');
  };

  const move = document.createElement('button');
  move.className = 'tool';
  move.textContent = '⌸';
  move.title = 'mover para outra pasta';
  move.onclick = (event) => {
    event.stopPropagation();
    startInlineEdit(row, label, item, 'group');
  };

  const kill = document.createElement('button');
  kill.className = 'tool kill';
  kill.textContent = '×';
  kill.title = 'encerrar terminal';
  kill.onclick = async (event) => {
    event.stopPropagation();
    await api(`/terminals/${item.id}`, { method: 'DELETE' });
    closePane(item.id);
    await refresh();
  };

  row.append(dot, label, move, kill);
  return row;
}

/// Edita nome ou pasta no lugar, sem caixa de diálogo.
function startInlineEdit(row, label, item, field) {
  editing = true;
  const input = document.createElement('input');
  input.value = item[field];
  input.placeholder = field === 'group' ? 'nome da pasta' : 'nome do terminal';
  row.replaceChild(input, label);
  input.focus();
  input.select();
  input.onclick = (event) => event.stopPropagation();

  let done = false;
  const commit = async () => {
    if (done) return;
    done = true;
    const value = input.value.trim();
    editing = false;
    if (value && value !== item[field]) {
      await api(`/terminals/${item.id}`, { method: 'PATCH', body: JSON.stringify({ [field]: value }) });
    }
    await refresh();
  };
  const cancel = () => {
    if (done) return;
    done = true;
    editing = false;
    refresh();
  };
  input.onblur = commit;
  input.onkeydown = (event) => {
    if (event.key === 'Enter') commit();
    if (event.key === 'Escape') cancel();
  };
}

/// Pede o nome da pasta na própria sidebar, sem caixa de diálogo do browser.
function promptForGroup() {
  editing = true;
  const row = document.createElement('div');
  row.className = 'item';
  const input = document.createElement('input');
  input.placeholder = 'nome da pasta';
  row.append(input);
  listEl.prepend(row);
  input.focus();

  let done = false;
  const finish = (name) => {
    if (done) return;
    done = true;
    editing = false;
    row.remove();
    if (name) createTerminal('shell', name);
    else refresh();
  };
  input.onblur = () => finish(input.value.trim());
  input.onkeydown = (event) => {
    if (event.key === 'Enter') finish(input.value.trim());
    if (event.key === 'Escape') finish(null);
  };
}

// ---------------------------------------------------------------- terminais
function ensurePane(id) {
  if (panes.has(id)) return panes.get(id);

  const host = document.createElement('div');
  host.className = 'screen';
  screensEl.append(host);

  const term = new Terminal({
    theme: THEMES[currentTheme].xterm,
    fontFamily: 'ui-monospace, "Cascadia Mono", Consolas, monospace',
    fontSize: 13,
    cursorBlink: true,
    scrollback: 5000,
    allowProposedApi: true,
  });
  const fit = new FitAddon.FitAddon();
  term.loadAddon(fit);
  term.open(host);

  const socket = new WebSocket(`ws://${location.host}/ws/${id}`);
  socket.binaryType = 'arraybuffer';
  socket.onmessage = (event) => term.write(new Uint8Array(event.data));
  socket.onopen = () => sendResize(socket, fit, term);
  socket.onclose = () =>
    term.write('\r\n\x1b[38;5;61m[ponte fechada — o processo segue no daemon]\x1b[0m\r\n');

  term.onData((data) => {
    if (socket.readyState === WebSocket.OPEN) {
      socket.send(JSON.stringify({ type: 'input', data }));
    }
  });

  const pane = { host, term, fit, socket };
  panes.set(id, pane);
  return pane;
}

function sendResize(socket, fit, term) {
  fit.fit();
  if (socket.readyState === WebSocket.OPEN) {
    socket.send(JSON.stringify({ type: 'resize', cols: term.cols, rows: term.rows }));
  }
}

function closePane(id) {
  const pane = panes.get(id);
  if (!pane) return;
  pane.socket.close();
  pane.term.dispose();
  pane.host.remove();
  panes.delete(id);
}

async function activate(id) {
  activeId = id;
  placeholderEl.style.display = 'none';
  const pane = ensurePane(id);
  for (const [paneId, other] of panes) other.host.classList.toggle('active', paneId === id);
  pane.term.focus();
  sendResize(pane.socket, pane.fit, pane.term);
  renderSidebar();
  await updateTopbar();
  if (document.body.classList.contains('with-panel')) renderPanel().catch(() => {});
}

const activeTerminal = () => terminals.find((item) => item.id === activeId);

// ---------------------------------------------------------------- pulso
/// Consumo recente na navbar: a última hora, a janela de 5h e a semana.
///
/// A porcentagem compara a hora atual com a **hora mais cheia já registrada**,
/// não com a cota do plano — esse número não existe nos arquivos locais.
async function updatePulse() {
  const pulse = await api('/usage/pulse');
  const box = document.getElementById('pulse');
  document.getElementById('pulse-hour').textContent =
    `${formatTokens(pulse.tokens_last_hour)} · ${pulse.hour_percent.toFixed(0)}%`;
  document.getElementById('pulse-week').textContent = formatTokens(pulse.tokens_last_week);

  const fill = document.getElementById('pulse-fill');
  fill.style.width = `${Math.min(pulse.hour_percent, 100)}%`;

  box.title =
    `última hora: ${formatTokens(pulse.tokens_last_hour)} tokens\n` +
    `janela de 5h: ${formatTokens(pulse.tokens_last_5h)}\n` +
    `últimos 7 dias: ${formatTokens(pulse.tokens_last_week)}\n` +
    `hora mais cheia já registrada: ${formatTokens(pulse.peak_hour_tokens)}\n\n` +
    `A % compara com o seu próprio pico, não com a cota do plano — ` +
    `o limite do plano não está nos arquivos locais.`;
  box.hidden = false;
}

// ---------------------------------------------------------------- uso
async function updateTopbar() {
  const item = activeTerminal();
  document.getElementById('active-name').textContent = item ? item.name : '—';
  document.getElementById('active-cwd').textContent = item ? item.cwd : '';
  const sessionEl = document.getElementById('active-session');
  const meterEl = document.getElementById('meter');
  sessionEl.textContent = '';
  meterEl.hidden = true;
  if (!item) return;

  try {
    const info = await api(`/terminals/${item.id}/claude-session`);
    if (!info.session) return;

    const code = document.createElement('code');
    code.textContent = info.session.resume_command;
    code.title = 'clique para copiar';
    code.onclick = () => navigator.clipboard.writeText(info.session.resume_command);
    sessionEl.append(code);

    // % de contexto: exato, e vem do transcript em disco — sem chamar API nenhuma.
    const usage = info.usage;
    const percent = usage.context_percent;
    const fill = document.getElementById('meter-fill');
    fill.style.width = `${Math.min(percent, 100)}%`;
    fill.className = 'fill' + (percent > 85 ? ' high' : percent > 60 ? ' mid' : '');
    document.getElementById('meter-value').textContent =
      `${percent.toFixed(0)}% · ${formatTokens(usage.context_tokens)}/${formatTokens(usage.context_limit)}`;
    meterEl.title =
      `entrada ${formatTokens(usage.input_tokens)} · saída ${formatTokens(usage.output_tokens)} · ` +
      `cache lido ${formatTokens(usage.cache_read_tokens)} · raciocínio ${formatTokens(usage.thinking_tokens)}` +
      (usage.model ? ` · ${usage.model}` : '');
    meterEl.hidden = false;
  } catch {
    /* terminal sem sessão de Claude — normal para shell */
  }
}

// ---------------------------------------------------------------- painel
const el = (tag, className, text) => {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
};

function renderSessionCard(session, cwd, group, extra) {
  const card = el('div', 'session');
  card.title = 'abrir esta sessão num terminal novo';
  card.onclick = () => resumeSession(session, cwd, group);
  card.append(el('div', 'title', session.title || '(sem título)'));

  const meta = el('div', 'meta');
  meta.append(el('span', null, formatDate(session.modified)));
  meta.append(el('span', null, `${session.message_count} msg`));
  const total =
    session.usage.input_tokens + session.usage.output_tokens + session.usage.cache_creation_tokens;
  meta.append(el('span', 'tokens', `${formatTokens(total)} tok`));
  if (session.usage.context_percent > 0) {
    meta.append(el('span', null, `${session.usage.context_percent.toFixed(0)}% ctx`));
  }
  if (extra) meta.append(extra);
  card.append(meta);
  return card;
}

async function renderPanel() {
  panelBody.textContent = '';
  const item = activeTerminal();

  if (activeTab === 'sessions') {
    if (!item) return panelBody.append(el('div', 'empty', 'selecione um terminal'));
    const sessions = await api(`/sessions?cwd=${encodeURIComponent(item.cwd)}`);
    if (!sessions.length) return panelBody.append(el('div', 'empty', 'nenhuma sessão neste diretório'));
    for (const session of sessions) panelBody.append(renderSessionCard(session, item.cwd, item.group));
    return;
  }

  if (activeTab === 'boot') {
    panelBody.append(el('div', 'empty', 'lendo o log de eventos do Windows…'));
    const groups = await api('/sessions/by-boot?limit=8');
    panelBody.textContent = '';
    if (!groups.length) return panelBody.append(el('div', 'empty', 'nenhum boot encontrado'));
    for (const group of groups) {
      const when = new Date(group.boot_at * 1000);
      panelBody.append(
        el('div', 'boot-head', `boot ${when.toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' })} · ${group.sessions.length} sessões`),
      );
      for (const session of group.sessions) {
        panelBody.append(renderSessionCard(session, item?.cwd, item?.group));
      }
    }
    return;
  }

  if (activeTab === 'active') {
    const sessions = await api('/sessions/active?within=900');
    if (!sessions.length) return panelBody.append(el('div', 'empty', 'nenhuma sessão ativa nos últimos 15 min'));
    panelBody.append(
      el('div', 'note', 'Sessões com transcript escrito há pouco — provavelmente abertas em outro terminal. Adotar reabre a conversa aqui com --resume, num processo novo; feche a janela antiga.'),
    );
    for (const session of sessions) {
      const adopt = el('button', 'adopt', 'adotar');
      adopt.onclick = (event) => {
        event.stopPropagation();
        resumeSession(session, item?.cwd, 'adotadas');
      };
      panelBody.append(renderSessionCard(session, item?.cwd, 'adotadas', adopt));
    }
    return;
  }

  // aba de uso
  panelBody.append(el('div', 'empty', 'somando os transcripts…'));
  const report = await api('/usage?days=10');
  panelBody.textContent = '';
  const totals = report.totals;

  const grid = el('div', 'stat-grid');
  const stat = (label, value, accent) => {
    const box = el('div', 'stat');
    box.append(el('div', 'k', label));
    box.append(el('div', 'v' + (accent ? ' accent' : ''), value));
    return box;
  };
  grid.append(stat('sessões', `${totals.sessions}`));
  grid.append(stat('projetos', `${totals.projects}`));
  grid.append(stat('saída', formatTokens(totals.output_tokens)));
  grid.append(stat('raciocínio', `${(totals.thinking_ratio * 100).toFixed(0)}%`));
  grid.append(stat('cache aproveitado', `${(totals.cache_hit_ratio * 100).toFixed(1)}%`, true));
  grid.append(stat('equiv. API', `US$ ${totals.cost_usd_equivalent.toFixed(0)}`, true));
  panelBody.append(grid);

  panelBody.append(
    el('div', 'note', 'O valor em dólar é o que este consumo custaria pela API. Assinatura não cobra por token — serve para comparar sessões, não como fatura.'),
  );

  const maxDay = Math.max(...report.by_day.map((day) => day.tokens), 1);
  panelBody.append(el('div', 'boot-head', 'por dia'));
  const days = el('div', 'bars');
  for (const day of report.by_day) {
    const row = el('div', 'row');
    row.append(el('span', 'who', day.date.slice(5)));
    const track = el('span', 'track');
    const fill = el('span', 'fill');
    fill.style.width = `${(day.tokens / maxDay) * 100}%`;
    track.append(fill);
    row.append(track);
    row.append(el('span', 'amount', formatTokens(day.tokens)));
    row.title = `${day.sessions} sessões · US$ ${day.cost_usd_equivalent.toFixed(2)}`;
    days.append(row);
  }
  panelBody.append(days);

  const maxProject = Math.max(...report.by_project.map((project) => project.tokens), 1);
  panelBody.append(el('div', 'boot-head', 'por projeto'));
  const projects = el('div', 'bars');
  for (const project of report.by_project) {
    const row = el('div', 'row');
    // O slug é o caminho com separadores trocados; o fim é o que identifica.
    row.append(el('span', 'who', project.slug.split('-').filter(Boolean).slice(-2).join('/')));
    const track = el('span', 'track');
    const fill = el('span', 'fill');
    fill.style.width = `${(project.tokens / maxProject) * 100}%`;
    track.append(fill);
    row.append(track);
    row.append(el('span', 'amount', formatTokens(project.tokens)));
    row.title = `${project.slug} · ${project.sessions} sessões`;
    projects.append(row);
  }
  panelBody.append(projects);
}

async function resumeSession(session, cwd, group) {
  const created = await api('/terminals', {
    method: 'POST',
    body: JSON.stringify({
      name: (session.title || session.id).slice(0, 28),
      group: group || 'Geral',
      cwd,
      resume: session.id,
    }),
  });
  await refresh();
  await activate(created.id);
}

for (const button of document.getElementById('tabs').children) {
  button.onclick = () => {
    activeTab = button.dataset.tab;
    for (const other of button.parentElement.children) {
      other.classList.toggle('active', other === button);
    }
    renderPanel().catch((error) => {
      panelBody.textContent = '';
      panelBody.append(el('div', 'empty', `falhou: ${error.message}`));
    });
  };
}

// ---------------------------------------------------------------- criação
async function createTerminal(kind, group) {
  const existing = terminals.filter((item) => item.command.includes(kind === 'claude' ? 'claude' : 'cmd')).length;
  const created = await api('/terminals', {
    method: 'POST',
    body: JSON.stringify({
      name: `${kind}-${existing + 1}`,
      group: group || activeTerminal()?.group || 'Geral',
      command: kind === 'claude' ? 'claude' : null,
    }),
  });
  await refresh();
  await activate(created.id);
}

document.getElementById('new-claude').onclick = () => createTerminal('claude');
document.getElementById('new-shell').onclick = () => createTerminal('shell');
// A pasta nasce junto com o primeiro terminal dela, com o nome que você escolher.
document.getElementById('new-group').onclick = promptForGroup;

document.getElementById('toggle-panel').onclick = () => {
  document.body.classList.toggle('with-panel');
  if (document.body.classList.contains('with-panel')) renderPanel().catch(() => {});
  const pane = panes.get(activeId);
  if (pane) sendResize(pane.socket, pane.fit, pane.term);
};

// ---------------------------------------------------------------- boot
const select = document.getElementById('theme-select');
for (const [key, theme] of Object.entries(THEMES)) {
  const option = document.createElement('option');
  option.value = key;
  option.textContent = theme.label;
  select.append(option);
}
select.value = currentTheme;
select.onchange = () => applyTheme(select.value);
applyTheme(currentTheme);

window.addEventListener('resize', () => {
  const pane = panes.get(activeId);
  if (pane) sendResize(pane.socket, pane.fit, pane.term);
});

// O daemon é a fonte de verdade: repescar mostra terminal que morreu sozinho.
setInterval(() => refresh().catch(() => {}), 4000);
updatePulse().catch(() => {});
setInterval(() => updatePulse().catch(() => {}), 60000);
refresh().catch((error) => {
  placeholderEl.textContent = `daemon não respondeu: ${error.message}`;
});
</script>
